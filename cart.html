<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Cart – Kilima Roasters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#B8CBB9;
  --ink:#20352A;
  --muted:#53665A;
  --accent:#2B4FD8;
  --card:#F5F4EB;
  --line:#B7C8B5;
  --soft:#E7EEE3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.7 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.05;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0;gap:16px;flex-wrap:wrap}
.logo{display:inline-flex;align-items:center;gap:12px;font:900 clamp(1.8rem,2.3vw,2.7rem)/1 "Bricolage Grotesque",sans-serif;text-decoration:none;letter-spacing:-.06em;color:var(--ink)}
.brand-mark{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(180deg,#f6eedf,#e8d7b7);border:1px solid var(--line);box-shadow:0 12px 20px rgba(59,39,28,.08)}
.brand-mark svg{width:27px;height:27px;display:block;fill:var(--accent)}
nav{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
nav a{text-decoration:none;font-weight:600;color:var(--ink);padding-bottom:4px;border-bottom:2px solid transparent}
nav a:hover,nav a:focus-visible{color:var(--accent);border-color:var(--accent)}
nav a[aria-current="page"]{border-color:var(--accent)}
.cart-link{display:inline-flex;align-items:center;gap:8px}
.cart-badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:0.75rem;font-weight:700}
.page-title{padding:44px 0 16px}
.page-title h1{font-size:clamp(2.5rem,7vw,4.7rem);letter-spacing:-.05em}
.page-title p{max-width:52ch;color:var(--muted);margin:16px 0 0}
section{padding:48px 0 64px;border-top:1px solid var(--line)}
.cart-layout{display:grid;grid-template-columns:1.5fr .8fr;gap:24px;align-items:start}
.cart-list,.summary{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
.item{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0;padding-bottom:0}
.item-name{font-weight:700}
.item-meta{color:var(--muted);font-size:0.95rem}
.qty-controls{display:flex;align-items:center;gap:8px}
.qty-controls button{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:50%;cursor:pointer;font-size:1rem}
.summary h2{margin-bottom:18px}
.summary-row{display:flex;justify-content:space-between;gap:16px;margin:12px 0;color:var(--muted)}
.summary-row.total{font-size:1.1rem;font-weight:700;color:var(--ink);padding-top:12px;border-top:1px solid var(--line)}
.btn{display:inline-block;width:100%;margin-top:18px;padding:14px 22px;border-radius:999px;font-weight:700;text-decoration:none;border:1px solid transparent;background:var(--accent);color:#fff;text-align:center}
.empty{padding:18px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);background:rgba(255,255,255,.2)}
footer{padding:28px 0 52px;border-top:1px solid var(--line);color:var(--muted);font-size:.96rem}
@media(max-width:760px){.cart-layout{grid-template-columns:1fr}nav{gap:12px}.item{grid-template-columns:1fr auto;}.item-meta{grid-column:1 / -1}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="index.html" aria-label="Kilima Roasters home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" role="img" aria-hidden="true">
          <path d="M33.5 10c-9.2 0-16.5 7.3-16.5 16.5 0 10.5 8.4 18.4 16.7 25.1 2 1.9 4 5 5.1 8.4 1.1-3.4 3.1-6.5 5.1-8.4 8.3-6.7 16.7-14.6 16.7-25.1C50 17.3 42.7 10 33.5 10zm0 9.2c5.7 0 10.8 4.7 10.8 10.9 0 6.2-5.1 11-10.8 11S22.7 36.3 22.7 30.1c0-6.2 5.1-10.9 10.8-10.9zm-2.8 5.6h5.7v10.6h-5.7V24.8z"/>
        </svg>
      </span>
      <span>Kilima Roasters</span>
    </a>
    <nav>
      <a href="coffee.html">Coffee</a>
      <a href="about.html">About</a>
      <a href="reviews.html">Reviews</a>
      <a href="contact.html">Contact</a>
      <a class="cart-link" href="cart.html" aria-current="page">Cart <span class="cart-badge" data-cart-count>0</span></a>
    </nav>
  </header>

  <main>
    <div class="page-title">
      <h1>Your cart</h1>
      <p>Review your order, adjust quantities, and continue to checkout.</p>
    </div>

    <section>
      <div class="cart-layout">
        <div id="cartItems" class="cart-list"></div>
        <aside class="summary">
          <h2>Order summary</h2>
          <div class="summary-row"><span>Subtotal</span><span id="subtotal">KES 0</span></div>
          <div class="summary-row"><span>Delivery</span><span>KES 250</span></div>
          <div class="summary-row total"><span>Total</span><span id="total">KES 0</span></div>
          <a class="btn" href="contact.html?checkout=1">Checkout</a>
        </aside>
      </div>
    </section>
  </main>

  <footer>&copy; 2026 Kilima Roasters. Demo website.</footer>
</div>
<script>
const CART_KEY = 'kilimaCart';

function getCart() {
  try {
    const items = JSON.parse(localStorage.getItem(CART_KEY) || '[]');
    return Array.isArray(items) ? items : [];
  } catch (error) {
    return [];
  }
}

function saveCart(items) {
  localStorage.setItem(CART_KEY, JSON.stringify(items));
  updateCartCount();
  renderCart();
}

function updateCartCount() {
  const cart = getCart();
  const count = cart.reduce((total, item) => total + Number(item.qty || 0), 0);
  document.querySelectorAll('[data-cart-count]').forEach((el) => {
    el.textContent = count;
    el.style.visibility = count > 0 ? 'visible' : 'hidden';
  });
}

function formatKES(value) {
  return 'KES ' + Number(value).toLocaleString('en-KE');
}

function renderCart() {
  const cart = getCart();
  const container = document.getElementById('cartItems');

  if (!container) return;

  if (!cart.length) {
    container.innerHTML = '<div class="empty">Your cart is empty. Add a few coffees to get started.</div>';
    document.getElementById('subtotal').textContent = 'KES 0';
    document.getElementById('total').textContent = 'KES 0';
    return;
  }

  let subtotal = 0;
  container.innerHTML = cart.map((item) => {
    const lineTotal = item.price * item.qty;
    subtotal += lineTotal;
    return `
      <div class="item">
        <div>
          <div class="item-name">${item.name}</div>
          <div class="item-meta">${formatKES(item.price)} each</div>
        </div>
        <div class="qty-controls">
          <button type="button" data-action="decrease" data-id="${item.id}">-</button>
          <span>${item.qty}</span>
          <button type="button" data-action="increase" data-id="${item.id}">+</button>
        </div>
        <div class="item-name">${formatKES(lineTotal)}</div>
      </div>
    `;
  }).join('');

  document.getElementById('subtotal').textContent = formatKES(subtotal);
  document.getElementById('total').textContent = formatKES(subtotal + 250);

  document.querySelectorAll('[data-action="increase"]').forEach((button) => {
    button.addEventListener('click', () => {
      const cartItems = getCart();
      const item = cartItems.find(entry => entry.id === button.dataset.id);
      if (item) {
        item.qty += 1;
        saveCart(cartItems);
      }
    });
  });

  document.querySelectorAll('[data-action="decrease"]').forEach((button) => {
    button.addEventListener('click', () => {
      const cartItems = getCart();
      const itemIndex = cartItems.findIndex(entry => entry.id === button.dataset.id);
      if (itemIndex >= 0) {
        cartItems[itemIndex].qty -= 1;
        if (cartItems[itemIndex].qty <= 0) {
          cartItems.splice(itemIndex, 1);
        }
        saveCart(cartItems);
      }
    });
  });
}

updateCartCount();
renderCart();
</script>
</body>
</html>
